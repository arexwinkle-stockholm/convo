const L={kid:"Barn",teen:"Tonåring",adult:"Vuxen"};
let age="teen",ti=0,en=true;
try{age=localStorage.getItem("age")||age;en=localStorage.getItem("en")!=="0"}catch(e){}
if(!D[age])age="teen";
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("age",age);localStorage.setItem("en",en?"1":"0")}catch(e){}};
const s2=s=>{const[a,b]=s.split("|");return[a,en?`<small>${b}</small>`:""]};
const TG={i:"Infinitiv",p:"Preteritum",s:"Supinum"};
const vb=t=>t.w?`<h3>Verb i meningar</h3><ul>${t.w.map(x=>{const[a,b,c]=x.split("|");return`<li><span class="tg">${TG[c]}</span>${a.replace(/\*(.+?)\*/g,"<b>$1</b>")}${en?`<small>${b.replace(/\*/g,"")}</small>`:""}</li>`}).join("")}</ul>`:"";
function render(){
 document.body.dataset.age=age;
 $("ages").innerHTML=Object.keys(L).map(k=>`<button data-a="${k}" aria-pressed="${k==age}">${L[k]}</button>`).join("");
 $("tp").innerHTML=D[age].map((t,i)=>`<option value="${i}"${i==ti?" selected":""}>${t.t}</option>`).join("");
 $("en").setAttribute("aria-pressed",en);
 const t=D[age][ti];
 $("out").innerHTML=`<div class="card"><h2>${t.t}</h2>${en?`<small>${t.e}</small>`:""}
 <h3>Fraser</h3><ul>${t.p.map(x=>{const[a,b]=s2(x);return`<li>${a}${b}</li>`}).join("")}</ul>
 <h3>Ord</h3><div class="chips">${t.v.map(x=>{const[a,b]=s2(x);return`<span>${a}${b}</span>`}).join("")}</div>
 ${vb(t)}<h3>Frågor</h3>${t.q.map((x,i)=>{const[a,b]=s2(x);return`<div class="b ${i%2?"z":"a"}"><b>Person ${i%2?"B":"A"}</b>${a}${b}</div>`}).join("")}</div>`;
}
$("ages").onclick=e=>{const k=e.target.dataset.a;if(k){age=k;ti=0;$("rq").hidden=true;save();render()}};
$("tp").onchange=e=>{ti=+e.target.value;render()};
$("rt").onclick=()=>{const n=D[age].length;let i=ti;while(n>1&&i==ti)i=Math.random()*n|0;ti=i;render()};
$("en").onclick=()=>{en=!en;save();render()};
$("rb").onclick=()=>{const all=D[age].flatMap(t=>t.q);const[a,b]=s2(all[Math.random()*all.length|0]);const r=$("rq");r.hidden=false;r.innerHTML=`<h3 style="margin-top:0">Fråga</h3>${a}${b}`};
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
